<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valyuta va Kripto</title>
    <style>
        body {
            background-color: #1a1a2e; color: #fff; font-family: sans-serif;
            margin: 0; padding: 20px; text-align: center;
        }
        .card {
            background-color: #16213e; padding: 20px; margin-bottom: 15px;
            border-radius: 10px; font-size: 20px;
        }
        span { font-weight: bold; color: #4ade80;}
    </style>
</head>
<body>
    <h2>Real vaqt narxlari</h2>
    
    <div class="card">💰 USD = <span id="usd">Yuklanmoqda...</span> so'm</div>
    <div class="card">🪙 BTC = <span id="btc">Yuklanmoqda...</span> $</div>
    <div class="card">💠 ETH = <span id="eth">Yuklanmoqda...</span> $</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        async function fetchRates() {
            try {
                const response = await fetch('/api/rates');
                const data = await response.json();
                
                document.getElementById('usd').innerText = data.USD_UZS;
                document.getElementById('btc').innerText = parseFloat(data.BTC_USD).toFixed(2);
                document.getElementById('eth').innerText = parseFloat(data.ETH_USD).toFixed(2);
            } catch (error) {
                console.error("Xatolik:", error);
            }
        }

        fetchRates();
        setInterval(fetchRates, 10000);
    </script>
</body>
</html>
